name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The suite runs TypeScript directly through Node's type stripping, so it needs Node 22.
  # Windows is here because path handling is where a POSIX-only bug would hide.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The published package claims Node 18. The suite cannot run there, so the compiled CLI is
  # built on 22 and then exercised on each older runtime it claims to support.
  compat:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node dist/cli.js --help
      # The fixture needs no Storybook install; doctor reads its index and counts captures.
      - name: doctor against the committed fixture
        working-directory: test/fixtures
        # Written to a file first so doctor's own exit status fails the step; the assertions
        # live in a committed script so CI and a local run read the JSON the same way, and
        # they hold on the structured counts, never on the human-readable title.
        run: |
          node ../../dist/cli.js doctor --json > "$RUNNER_TEMP/doctor.json"
          node ../../scripts/verify-doctor.mjs "$RUNNER_TEMP/doctor.json" 5 7

  # The report and the capture waits are client-side behaviour that only a real browser shows.
  # Locally these run from the pre-commit hook when their sources change; here they run always.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:report
      - run: npm run check:stabilize
